# ============================================================================
# Unsupervised — HDBSCAN (leaf) + iterative prototype propagation.
# Identical to unsup_hdbscan_propagation except propagation.mode: iterative.
# ============================================================================
experiment:
  name: unsup_hdbscan_propagation_iter
  description: "Unsupervised — HDBSCAN leaf + iterative prototype propagation"

mode: unsupervised

dataset:
  extensions: ["png"]

segmenter:
  model: medsam2
  device: cuda
  grid_side: 6
  score_threshold: 0.50
  iou_threshold: 0.50

labeler:
  algorithm: hdbscan
  standardize: true
  features:
    - V
    - Cx
    - Cy
    - Dx
    - Dy
    - L
    - solidity
    - extent
    - compact
    - hu0
    - intensity_mean
    - intensity_std
  hdbscan:
    cluster_selection_method: leaf
    min_cluster_size_fraction: 0.05
    min_samples_fraction: 0.01

propagation:
  mode: iterative
  references_per_cluster: 5
  quality:
    min_image_frequency: 0.05
    min_avg_labeling_confidence: 0.5
    min_avg_sam_confidence: 0.7
  mask_selection:
    sam_score_weight: 0.7
    min_combined_score: 0.5
  cluster_nms:
    enabled: true
    iou_threshold: 0.5
