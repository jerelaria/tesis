# ============================================================================
# Test: single-cluster unsupervised propagation (KMeans n=1)
# Forces good_clusters = {0} — no interleaving, all frames condition the
# same object. Use to isolate whether multi-cluster interleaving breaks
# MedSAM2 memory vs. single-organ propagation working correctly.
# ============================================================================
experiment:
  name: unsup_1cluster_test
  description: "Prueba: 1 solo cluster para aislar interleaving"

mode: unsupervised

dataset:
  extensions: ["png"]

segmenter:
  model: medsam2
  device: cuda
  grid_side: 6
  score_threshold: 0.50
  iou_threshold: 0.50

labeler:
  algorithm: kmeans
  standardize: true
  features:
    - V
    - Cx
    - Cy
    - Dx
    - Dy
    - L
    - solidity
    - extent
    - compact
    - hu0
    - intensity_mean
    - intensity_std
  kmeans:
    n_clusters: 1

propagation:
  mode: independent
  references_per_cluster: 5
  quality:
    min_image_frequency: 0.2
    min_avg_labeling_confidence: 0.5
    min_avg_sam_confidence: 0.6
  mask_selection:
    sam_score_weight: 0.5
    min_combined_score: 0.5
