# ============================================================================
# Unsupervised — HDBSCAN (leaf) + prototype propagation
# ============================================================================
experiment:
  name: unsup_hdbscan_propagation
  description: "Unsupervised — HDBSCAN leaf + batch prototype propagation"

mode: unsupervised

dataset:
  extensions: ["png"]

segmenter:
  model: medsam2
  device: cuda
  grid_side: 6
  score_threshold: 0.50
  iou_threshold: 0.50

labeler:
  algorithm: "hdbscan"
  features: ["V", "Cx", "Cy", "Dx", "Dy", "L"]
  hdbscan:
    min_cluster_size_fraction: 0.3
    min_samples_fraction: 0.1
    cluster_selection_method: leaf

propagation:
  references_per_cluster: 3
  quality:
    min_image_frequency: 0.3
    min_avg_labeling_confidence: 0.5
    min_avg_sam_confidence: 0.6
  mask_selection:
    sam_score_weight: 0.5
    min_combined_score: 0.5
